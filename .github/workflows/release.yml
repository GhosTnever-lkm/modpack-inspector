name: Test and publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check app.js
      - name: Build release archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          folder="ModPack-Inspector-${version}"
          mkdir -p "release/${folder}"
          cp -r index.html app.js zip-path.mjs styles.css README.md LICENSE VERSION CHANGELOG.md .nojekyll docs "release/${folder}/"
          (cd release && zip -qr "../${folder}.zip" "${folder}")
          sha256sum "${folder}.zip" > "${folder}.zip.sha256"
          printf 'folder=%s\n' "$folder" >> "$GITHUB_OUTPUT"
        id: package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.folder }}.zip" "${{ steps.package.outputs.folder }}.zip.sha256" --title "ModPack Inspector $GITHUB_REF_NAME" --notes-file CHANGELOG.md
